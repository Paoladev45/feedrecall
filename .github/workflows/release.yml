name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 11.18.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 22.16.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - name: Pack the portable package
        shell: bash
        run: |
          mkdir release
          pnpm pack --pack-destination release
          mv release/feedrecall-*.tgz release/feedrecall.tgz
          sha256sum release/feedrecall.tgz > release/feedrecall.tgz.sha256
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "${{ github.ref_name }}"
          release/feedrecall.tgz
          release/feedrecall.tgz.sha256
          --verify-tag
          --generate-notes
          --title "FeedRecall ${{ github.ref_name }}"
