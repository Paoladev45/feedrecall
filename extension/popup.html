<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FeedRecall Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <header><span>FR</span><div><strong>FeedRecall</strong><small>Visible posts only</small></div></header>
      <label>Signal type<select id="kind"><option value="like">Like</option><option value="bookmark">Bookmark</option><option value="repost">Repost</option><option value="saved">Saved</option></select></label>
      <div class="count"><b id="count">0</b><span>posts ready</span></div>
      <p id="status">Open an X Likes or Bookmarks page, scroll through the posts you want, then scan.</p>
      <div class="actions"><button id="scan" type="button">Scan tab</button><button id="export" type="button" disabled>Export JSON</button></div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
